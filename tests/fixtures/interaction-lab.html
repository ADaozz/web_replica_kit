<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#fff;color:#111}header{display:flex;justify-content:flex-end;padding:16px;position:relative}button{font:inherit;padding:8px} [hidden]{display:none!important}.anchor{position:relative;display:inline-block}.menu{position:absolute;right:0;top:100%;width:190px;padding:12px;background:#eee;border:1px solid #333;z-index:3}.nested{left:auto;right:0;top:100%}.scroll{margin:24px;height:170px;overflow:auto;border:1px solid #999}.canvas{height:500px;padding:25px}.transformed{transform:translate(12px,4px);position:relative;margin:24px;height:110px}.transformed .menu{right:auto;left:0}.tooltip{position:absolute;top:100%;left:0;width:100px;background:#222;color:#fff;padding:6px;display:none}.anchor:hover>.tooltip,.anchor:focus-within>.tooltip{display:block}dialog{padding:24px}aside{width:160px;flex-shrink:0}.collapsed{width:60px}.workspace{display:flex;margin:24px}.main{flex:1}.active{background:#cef}#portal{position:absolute;top:80px;right:30px;width:180px;background:#ddd;padding:10px}footer{height:700px}
</style></head><body>
<header><div class="anchor" id="top-anchor"><button id="top" aria-haspopup="menu" aria-expanded="false" aria-controls="top-menu">Top menu</button><div id="top-menu" class="menu" role="menu" hidden><button id="nested" aria-haspopup="menu" aria-expanded="false" aria-controls="nested-menu">Nested menu</button><div id="nested-menu" class="menu nested" role="menu" hidden>Nested content</div><div id="dynamic-host"></div></div></div></header>
<div class="scroll" id="scroll"><div class="canvas"><div class="anchor"><button id="scroll-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="scroll-menu">Scroll menu</button><div id="scroll-menu" class="menu" role="menu" hidden>Scroll content</div></div></div></div>
<div class="transformed"><div class="anchor"><button id="transform-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="transform-menu">Transform menu</button><div id="transform-menu" class="menu" role="menu" hidden>Transform content</div></div></div>
<button id="portal-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="portal">Portal menu</button><div id="portal" role="menu" hidden>Portal content</div>
<div class="workspace"><aside id="sidebar">Sidebar</aside><main class="main"><button id="side" aria-expanded="true" aria-controls="sidebar">Sidebar size</button><div role="tablist"><button id="tab-a" role="tab" aria-selected="true" aria-controls="tab-content">First tab</button><button id="tab-b" role="tab" aria-selected="false" aria-controls="tab-content">Second tab</button></div><section id="tab-content"><p id="first">First content</p></section><button id="switch" role="switch" aria-checked="false" aria-controls="advanced">Advanced</button><section id="advanced" hidden>Advanced region</section><input id="note" aria-label="Note" value="keep me"><button id="risky" aria-expanded="false" aria-controls="risky-panel">Details</button><div id="risky-panel" hidden>Backend content</div><button id="danger" aria-expanded="false">Delete item</button></main></div>
<button id="dialog-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="dialog">Dialog</button><dialog id="dialog">Dialog body</dialog>
<button id="popover-trigger" popovertarget="popover" aria-haspopup="dialog" aria-controls="popover">Popover</button><div id="popover" popover>Popover body</div>
<div class="anchor"><button id="tooltip-trigger" aria-describedby="tooltip">Tooltip</button><div class="tooltip" role="tooltip" id="tooltip">Tooltip body</div></div>
<a href="/settings" id="route">Settings</a><div id="route-content">Home</div>
<footer></footer>
<script>
for(const id of ['top','nested','scroll-trigger','transform-trigger','portal-trigger']){
 const button=document.getElementById(id),panel=document.getElementById(button.getAttribute('aria-controls'));
 function close(){button.setAttribute('aria-expanded','false');panel.hidden=true;if(id==='top')document.getElementById('dynamic-host').textContent=''}
 button.onclick=()=>{const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(open));panel.hidden=!open;if(id==='top'){document.getElementById('dynamic-host').innerHTML=open?'<button id="dynamic" aria-expanded="false" aria-controls="dynamic-panel">Dynamic item</button><section id="dynamic-panel" hidden>New panel<input id="dynamic-note" value="seed"></section>':'';const dynamic=document.getElementById('dynamic');if(dynamic)dynamic.onclick=()=>{const on=dynamic.getAttribute('aria-expanded')!=='true';dynamic.setAttribute('aria-expanded',String(on));document.getElementById('dynamic-panel').hidden=!on}}};
 button.addEventListener('keydown',e=>{if(e.key==='Escape'){close();e.stopPropagation()}})
}
for(const tab of document.querySelectorAll('[role=tab]'))tab.onclick=()=>{for(const other of document.querySelectorAll('[role=tab]')){other.setAttribute('aria-selected',String(other===tab));other.className=other===tab?'active':''}document.getElementById('tab-content').innerHTML=tab.id==='tab-b'?'<p id="second">Second content</p>':'<p id="first">First content</p>'};
document.getElementById('tab-a').className='active';document.getElementById('tab-b').className='';
document.getElementById('switch').onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',String(on));document.getElementById('advanced').hidden=!on};
document.getElementById('side').onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(on));document.getElementById('sidebar').className=on?'':'collapsed'};
document.getElementById('risky').onclick=()=>fetch('/write',{method:'POST'}).catch(()=>{});
document.getElementById('danger').onclick=()=>fetch('/delete',{method:'POST'});
const dialog=document.getElementById('dialog'),trigger=document.getElementById('dialog-trigger');trigger.onclick=()=>{trigger.setAttribute('aria-expanded','true');dialog.showModal()};dialog.onclose=()=>trigger.setAttribute('aria-expanded','false');
document.getElementById('route').onclick=e=>{e.preventDefault();history.pushState({},'','/settings');document.getElementById('route-content').textContent='Settings'};window.onpopstate=()=>document.getElementById('route-content').textContent=location.pathname==='/settings'?'Settings':'Home';
</script></body></html>
